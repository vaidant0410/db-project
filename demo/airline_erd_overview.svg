<rect x="40" y="285" width="300" height="170" rx="9" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/><text x="54" y="310" font-size="15" font-weight="700" fill="#1c1917">How to read it</text><g stroke="#44403c" fill="none"><line x1="54" y1="329" x2="74" y2="329" stroke-width="2"/><line x1="60" y1="322" x2="60" y2="336" stroke-width="2.6"/></g><text x="88" y="333" font-size="13.5" fill="#44403c">a bar means one</text><g stroke="#44403c" fill="none"><line x1="54" y1="351" x2="74" y2="351" stroke-width="2"/><line x1="74" y1="351" x2="58" y2="343" stroke-width="2.3"/><line x1="74" y1="351" x2="58" y2="351" stroke-width="2.3"/><line x1="74" y1="351" x2="58" y2="359" stroke-width="2.3"/></g><text x="88" y="355" font-size="13.5" fill="#44403c">a crow's foot means many</text><text x="54" y="383" font-size="13.5" font-weight="700" fill="#1c1917">If the linked row is deleted:</text><line x1="54" y1="400" x2="78" y2="400" stroke="#2563eb" stroke-width="3.4"/><text x="88" y="404" font-size="13.5" fill="#44403c">CASCADE: delete this too</text><line x1="54" y1="420" x2="78" y2="420" stroke="#ea580c" stroke-width="3.4"/><text x="88" y="424" font-size="13.5" fill="#44403c">SET NULL: keep it, clear the link</text><line x1="54" y1="440" x2="78" y2="440" stroke="#dc2626" stroke-width="3.4"/><text x="88" y="444" font-size="13.5" fill="#44403c">NO ACTION: refuse the delete</text>
