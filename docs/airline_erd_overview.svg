<text x="200.0" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">airports</text>
<text x="200.0" y="166" text-anchor="middle" font-size="14" fill="#ffffff">where flights take off and land</text>
<rect x="490" y="100" width="320" height="90" rx="9" fill="#6d28d9" filter="url(#shadow)"/>
<text x="650.0" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">flights</text>
