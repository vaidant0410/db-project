<text x="92" y="324" font-size="13" fill="#57534e">a crow’s foot means many</text>
<text x="56" y="354" font-size="13.5" font-weight="700" fill="#1c1917">If the linked row is deleted:</text>
<line x1="56" y1="372" x2="84" y2="372" stroke="#2563eb" stroke-width="3"/>
