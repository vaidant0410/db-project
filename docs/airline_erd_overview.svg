<text x="92" y="398" font-size="13" fill="#57534e">NO ACTION: refuse the delete</text>
<line x1="56" y1="416" x2="84" y2="416" stroke="#57534e" stroke-width="2.6" stroke-dasharray="7 6"/>
<text x="92" y="420" font-size="13" fill="#57534e">no link: filled in by a trigger</text>
