<rect x="940" y="330" width="320" height="90" rx="9" fill="#57534e" filter="url(#shadow)"/>
<text x="1100.0" y="370" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">booking_audit_log</text>
<text x="1100.0" y="396" text-anchor="middle" font-size="14" fill="#ffffff">the diary of every change</text>
<rect x="40" y="560" width="320" height="90" rx="9" fill="#0f766e" filter="url(#shadow)"/>
<text x="200.0" y="600" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">passengers</text>
