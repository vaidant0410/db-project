<rect x="490" y="560" width="320" height="90" rx="9" fill="#15803d" filter="url(#shadow)"/>
<text x="650.0" y="600" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">bookings</text>
<text x="650.0" y="626" text-anchor="middle" font-size="14" fill="#ffffff">a passenger holding a seat</text>
<rect x="940" y="560" width="320" height="90" rx="9" fill="#15803d" filter="url(#shadow)"/>
<text x="1100.0" y="600" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">payments</text>
<text x="1100.0" y="626" text-anchor="middle" font-size="14" fill="#ffffff">money paid, and money refunded</text>
<rect x="40" y="250" width="320" height="190" rx="9" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
<text x="56" y="278" font-size="16" font-weight="700" fill="#1c1917">How to read it</text>
